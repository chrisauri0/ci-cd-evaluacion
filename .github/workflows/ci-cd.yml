name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  OO_URL: ${{ secrets.OO_URL }}
  OO_USER: ${{ secrets.OO_USER }}
  OO_PASSWORD: ${{ secrets.OO_PASSWORD }}
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/cicd-observability-api

jobs:
  # ------------------------------------------------------------------
  # 1) PRUEBAS (Playwright: API + UI). Si fallan, nada más se ejecuta.
  # ------------------------------------------------------------------
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_USER: app
      DB_PASS: app
      DB_NAME: appdb
      JWT_SECRET: ci-secret
      OTEL_SDK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Ejecutar pruebas Playwright (API + UI)
        run: pnpm test:e2e

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # --- Trazabilidad en OpenObserve (RF-03) ---
      - name: Registrar pruebas OK en OpenObserve
        if: success()
        run: bash scripts/log-openobserve.sh tests_finished success "Suite Playwright aprobada"
      - name: Registrar fallo de pruebas y despliegue bloqueado en OpenObserve
        if: failure()
        run: |
          bash scripts/log-openobserve.sh tests_finished failure "Suite Playwright con fallos"
          bash scripts/log-openobserve.sh deploy_blocked blocked "Despliegue bloqueado: las pruebas fallaron (no se abre SSH hacia EC2)"

  # ------------------------------------------------------------------
  # 2) BUILD + PUSH de la imagen (solo main, solo si pasaron las pruebas)
  # ------------------------------------------------------------------
  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Registrar build en OpenObserve
        if: always()
        run: bash scripts/log-openobserve.sh image_pushed "${{ job.status }}" "Imagen ${{ env.IMAGE }}:${{ github.sha }}"

  # ------------------------------------------------------------------
  # 3) DEPLOY a AWS EC2 por SSH (solo si test y build fueron exitosos)
  # ------------------------------------------------------------------
  deploy:
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generar .env de producción
        run: |
          {
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}"
            echo "IMAGE_TAG=${{ github.sha }}"
            echo "DB_PASS=${{ secrets.DB_PASS }}"
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
            echo "ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}"
            echo "ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}"
            echo "OO_EMAIL=${{ secrets.OO_USER }}"
            echo "OO_PASSWORD=${{ secrets.OO_PASSWORD }}"
            echo "OO_BASIC_AUTH=$(printf '%s' '${{ secrets.OO_USER }}:${{ secrets.OO_PASSWORD }}' | base64 -w0)"
          } > .env

      - name: Copiar archivos al servidor
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,otel-collector-config.yaml,.env"
          target: "~/app"

      - name: Actualizar contenedores en EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/app
            docker compose pull api
            docker compose up -d --remove-orphans
            docker image prune -f
            docker compose ps

      - name: Registrar despliegue completado en OpenObserve
        if: success()
        run: bash scripts/log-openobserve.sh deploy_completed success "Contenedores actualizados en EC2 (${{ github.sha }})"
      - name: Registrar despliegue fallido en OpenObserve
        if: failure()
        run: bash scripts/log-openobserve.sh deploy_completed failure "Falló la actualización de contenedores en EC2"
