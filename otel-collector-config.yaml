# OpenTelemetry Collector:
#  - recibe logs, métricas y trazas de la API (OTLP)
#  - mide recursos del servidor EC2 (CPU, RAM, red, disco) con hostmetrics
#  - raspa node-exporter para temperatura (hwmon / thermal_zone) y ancho de banda
#  - todo se envía a OpenObserve por OTLP/HTTP
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

  hostmetrics:
    collection_interval: 15s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      network: {}
      load: {}
      disk: {}
      filesystem: {}

  prometheus:
    config:
      scrape_configs:
        - job_name: node-exporter
          scrape_interval: 15s
          static_configs:
            - targets: ["node-exporter:9100"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "node_(hwmon_temp_celsius|thermal_zone_temp|network_receive_bytes_total|network_transmit_bytes_total)"
              action: keep

processors:
  batch: {}
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]

exporters:
  otlphttp/openobserve:
    endpoint: http://openobserve:5080/api/default
    headers:
      Authorization: "Basic ${env:OO_BASIC_AUTH}"
      stream-name: default

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlphttp/openobserve]
    metrics:
      receivers: [otlp, hostmetrics, prometheus]
      processors: [resourcedetection, batch]
      exporters: [otlphttp/openobserve]
    logs:
      receivers: [otlp]
      processors: [resourcedetection, batch]
      exporters: [otlphttp/openobserve]
